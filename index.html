<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoupTerminal</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <div id="screen">
    <div id="output"></div>

    <div id="inputLine" hidden>
      <span id="prompt"></span>
      <span id="typed"></span><span id="cursor"></span>
      <input id="cmdline" autofocus autocomplete="off" spellcheck="false"
             aria-label="Riga di comando">
    </div>
  </div>

  <script src="src/js/filesystem.js"></script>
  <script src="src/js/commands.js"></script>
  <script src="src/js/engine.js"></script>
  <script src="src/js/boot.js"></script>
</body>
</html>
